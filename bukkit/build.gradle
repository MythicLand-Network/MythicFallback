plugins {
    id 'com.gradleup.shadow'
}

apply from: rootProject.file('../MythicFramework/gradle/runtime-library-manifest.gradle')
apply from: rootProject.file('../MythicFramework/gradle/spigot-1.8.8.gradle')

dependencies {
    firstParty project(':common')
    firstParty 'cn.mythicland:mythic-framework-core:1.0.0'
    firstParty 'cn.mythicland:mythic-framework-bukkit:1.0.0'

    compileOnly files(spigot188Jar)
}

tasks.named('compileJava') {
    dependsOn tasks.named('prepareSpigot188')
}

tasks.named('shadowJar') {
    archiveFileName = 'MythicFallback-Bukkit.jar'
    configurations = [project.configurations.firstPartyEmbedded]
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

tasks.named('jar') {
    archiveFileName = 'MythicFallback-Bukkit-plain.jar'
}

tasks.named('sourcesJar') {
    archiveFileName = 'MythicFallback-Bukkit-sources.jar'
}

tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}

tasks.named('processResources') {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
