pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

apply from: file('../MythicFramework/gradle/workspace-build-lock.gradle')

rootProject.name = 'MythicFallback'

include 'common'
include 'bukkit'
include 'velocity'
include 'universal'

def frameworkDirectory = file('../MythicFramework')

if (!frameworkDirectory.isDirectory()) {
    throw new GradleException("Missing sibling project MythicFramework: ${frameworkDirectory}")
}

includeBuild(frameworkDirectory)
